<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eTrack — Template</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Copy of dashboard sidebar/top-nav styles (kept minimal for template) */
    body { background:#ffffff; font-family:'Inter', sans-serif; }
    .app-sidebar { position:fixed; left:0; top:0; height:100vh; width:200px; background:linear-gradient(180deg,#0056d2 0%,#003b82 100%); padding:18px; box-sizing:border-box; color:#fff; z-index:1040; border-right:1px solid rgba(255,255,255,0.04); border-top-right-radius:12px; border-bottom-right-radius:12px; }
    .app-sidebar .brand { display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:12px; }
    .app-sidebar .brand img { height:56px; width:56px; border-radius:10px; }
    .app-sidebar .nav-list { margin-top:10px; display:flex; flex-direction:column; gap:10px; }
    .app-sidebar a.nav-link { color:rgba(255,255,255,0.95); text-decoration:none; padding:8px 10px; border-radius:8px; font-weight:600; }
    .app-sidebar a.nav-link:hover { background: rgba(255,255,255,0.05); }

    .top-nav { background:#003b82; color:white; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; }
    .top-nav .mobile-username { color:#fff; font-weight:700; margin-left:8px; font-size:14px; }

    .main { padding-left:0; }
    .content-inner { max-width:900px; margin:12px auto; padding:12px; }
    @media(min-width:768px){ .main { padding-left:220px; } }
  </style>
</head>
<body>
  <aside class="app-sidebar">
    <div class="brand">
      <img src="../asset/img/logo.png" alt="eTrack logo">
      <div id="sidebarUserName" style="font-weight:700;font-size:14px;">User</div>
    </div>
    <nav class="nav-list">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="report.html" class="nav-link">Report</a>
      <a href="goals.html" class="nav-link">Goals</a>
      <a href="../index.html" class="nav-link logout">Log out</a>
    </nav>
  </aside>

  <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
  <div id="mobileMenuOverlay" class="mobile-menu-overlay" aria-hidden="true"></div>
  <div id="mobileMenu" class="mobile-menu" aria-hidden="true" style="display:none; position:fixed; top:56px; right:12px; z-index:1060; background:#fff; padding:8px; border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,0.12);">
    <a href="dashboard.html">Dashboard</a>
    <a href="report.html">Report</a>
    <a href="goals.html">Goals</a>
    <a href="../index.html" class="logout">Log out</a>
  </div>

  <div class="top-nav">
    <div class="d-flex align-items-center">
      <img src="../asset/img/logo.png" style="height:34px;">
      <span id="mobileUserName" class="mobile-username">User</span>
    </div>
    <button id="navMenuBtn" class="btn text-white">☰</button>
  </div>

  <div class="main">
    <div class="content-inner">
      <h1 class="h5">Template Page</h1>
      <p class="text-muted">Use this file as a starting point for new pages. Put your page content below.</p>

      <div class="card p-3">
        <h4>Content area</h4>
        <p>This is a placeholder. Replace this with your page-specific HTML.</p>
      </div>
    </div>
  </div>

  <script>
    // Mobile menu toggle
    const navMenuBtn = document.getElementById('navMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
    navMenuBtn && navMenuBtn.addEventListener('click', ()=>{
      if(window.innerWidth < 768){
        mobileMenu.classList.toggle('show');
        mobileMenu.style.display = mobileMenu.classList.contains('show') ? 'block' : 'none';
      }
    });

    // populate username from localStorage
    (function(){
      const name = localStorage.getItem('etrack_user_name') || 'User';
      const el = document.getElementById('sidebarUserName');
      const m = document.getElementById('mobileUserName');
      if(el) el.textContent = name;
      if(m) m.textContent = name;
    })();
  </script>
</body>
</html>
