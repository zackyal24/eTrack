<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eTrack — Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../asset/css/styles.css" />
    <link rel="stylesheet" href="../asset/css/dashboard.css" />
  </head>
  <body>
    <!-- Left Sidebar -->
    <aside class="app-sidebar">
      <div class="brand">
        <img src="../asset/img/logo.png" alt="eTrack logo" class="brand-logo" />
        <div id="sidebarUser" style="text-align: center; margin-top: 4px">
          <div
            id="sidebarUserName"
            style="font-weight: 700; font-size: 14px; line-height: 1"
          >
            User
          </div>
        </div>
      </div>
      <nav class="nav-list">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="report.html" class="nav-link">Report</a>
        <a href="goals.html" class="nav-link">Goals</a>
        <a href="../index.html" class="nav-link logout">Log out</a>
      </nav>
    </aside>

    <!-- mobile overlay (opened by navbar menu button) -->
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
    <!-- mobile small menu + overlay (used on small screens) -->
    <div
      id="mobileMenuOverlay"
      class="mobile-menu-overlay"
      aria-hidden="true"
    ></div>
    <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
      <a href="dashboard.html">Dashboard</a>
      <a href="#">Report</a>
      <a href="#">Goals</a>
      <a href="#" class="logout">Log out</a>
    </div>

    <!-- Top Navigation -->
    <div class="top-nav">
      <div class="d-flex align-items-center gap-2">
        <img src="../asset/img/logo.png" style="height: 34px" />
        <span id="mobileUserName" class="mobile-username">User</span>
      </div>
      <button id="navMenuBtn" class="btn text-white">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="currentColor"
          class="bi bi-list"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
          />
        </svg>
      </button>
    </div>

    <div class="main">
      <div class="container-dashboard content-inner">
        <script>
          // populate sidebar user name from localStorage
          (function () {
            const name = localStorage.getItem("etrack_user_name") || "User";
            const elName = document.getElementById("sidebarUserName");
            if (elName) elName.textContent = name;
            const mobileEl = document.getElementById("mobileUserName");
            if (mobileEl) mobileEl.textContent = name;
          })();
        </script>

        <!-- Page header -->
        <div
          class="page-header d-flex align-items-center justify-content-between mt-3 mb-2"
        >
          <div>
            <h1 class="mb-0">Dashboard</h1>
            <div class="text-muted small">
              Overview of your income, expenses and balance
            </div>
          </div>
        </div>

        <!-- Unified Month + Summary (single colored bar) -->
        <div
          class="summary-row d-flex align-items-center justify-content-between mt-3"
        >
          <div class="d-flex align-items-center gap-2">
            <button id="prevMonth" class="btn btn-sm btn-light">◀</button>
            <div id="monthLabel" class="fw-semibold">March 2025</div>
            <button id="nextMonth" class="btn btn-sm btn-light">▶</button>
          </div>

          <div class="d-flex gap-3 align-items-center">
            <div class="summary-item text-end">
              <div class="summary-title">Income</div>
              <div id="incomeValue" class="summary-value">Rp 0</div>
            </div>

            <div class="summary-item text-end">
              <div class="summary-title">Expenses</div>
              <div id="expensesValue" class="summary-value">Rp 0</div>
            </div>

            <div class="summary-item text-end">
              <div class="summary-title">Balance</div>
              <div id="balanceValue" class="summary-value">Rp 0</div>
            </div>
          </div>
        </div>

        <!-- Transactions (populated from backend) -->
        <div id="transactionsList" class="mt-2"></div>
      </div>
    </div>

    <!-- Floating Add Button -->
    <!-- Floating Add Button (single, with menu) -->
    <div class="position-fixed" style="bottom: 20px; right: 20px; z-index: 999">
      <!-- Hidden menu (placed above the button) -->
      <div id="fabMenu" class="" aria-hidden="true">
        <button id="fabIncome" class="fab-action income">
          <span class="dot">💰</span> <span>Income</span>
        </button>
        <button id="fabExpense" class="fab-action expense">
          <span class="dot">🧾</span> <span>Expense</span>
        </button>
      </div>

      <button
        id="fabBtn"
        class="fab-menu-plus btn rounded-circle"
        aria-controls="fabMenu"
        aria-expanded="false"
        style="
          width: 55px;
          height: 55px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 28px;
        "
      >
        +
      </button>
    </div>

    <script>
      const fabBtn = document.getElementById("fabBtn");
      const fabMenu = document.getElementById("fabMenu");

      function openFabMenu() {
        fabMenu.classList.add("fab-menu-show");
        fabMenu.setAttribute("aria-hidden", "false");
        fabBtn.setAttribute("aria-expanded", "true");
      }

      function closeFabMenu() {
        fabMenu.classList.remove("fab-menu-show");
        fabMenu.setAttribute("aria-hidden", "true");
        fabBtn.setAttribute("aria-expanded", "false");
      }

      function toggleFabMenu() {
        if (fabMenu.classList.contains("fab-menu-show")) closeFabMenu();
        else openFabMenu();
      }

      fabBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFabMenu();
      });

      // close when clicking outside
      document.addEventListener("click", (e) => {
        if (!fabMenu.contains(e.target) && e.target !== fabBtn) {
          closeFabMenu();
        }
      });

      // close with Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeFabMenu();
      });

      // stop clicks inside menu from closing when interacting with buttons
      fabMenu.addEventListener("click", (e) => {
        e.stopPropagation();
        const btn = e.target.closest("button");
        if (!btn) return;
        if (btn.id === "fabIncome") {
          // navigate to income page
          window.location.href = "income.html";
          return;
        }
        if (btn.id === "fabExpense") {
          // navigate to expense page
          window.location.href = "expense.html";
          return;
        }
        closeFabMenu();
      });

      // Sidebar toggle for mobile
      const sidebar = document.querySelector(".app-sidebar");
      const navMenuBtn = document.getElementById("navMenuBtn");
      const sidebarOverlay = document.getElementById("sidebarOverlay");
      const mobileMenu = document.getElementById("mobileMenu");
      const mobileMenuOverlay = document.getElementById("mobileMenuOverlay");

      function openSidebar() {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("show");
        sidebarOverlay.setAttribute("aria-hidden", "false");
      }
      function closeSidebar() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("show");
        sidebarOverlay.setAttribute("aria-hidden", "true");
      }

      navMenuBtn &&
        navMenuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          // on small screens show small mobile menu instead of full sidebar
          if (window.innerWidth <= 767) {
            const isOpen = mobileMenu.classList.contains("show");
            if (isOpen) {
              mobileMenu.classList.remove("show");
              mobileMenuOverlay.classList.remove("show");
              mobileMenu.setAttribute("aria-hidden", "true");
              mobileMenuOverlay.setAttribute("aria-hidden", "true");
            } else {
              mobileMenu.classList.add("show");
              mobileMenuOverlay.classList.add("show");
              mobileMenu.setAttribute("aria-hidden", "false");
              mobileMenuOverlay.setAttribute("aria-hidden", "false");
            }
            return;
          }
          openSidebar();
        });

      sidebarOverlay &&
        sidebarOverlay.addEventListener("click", () => closeSidebar());
      // mobile small menu overlay close
      mobileMenuOverlay &&
        mobileMenuOverlay.addEventListener("click", () => {
          mobileMenu.classList.remove("show");
          mobileMenuOverlay.classList.remove("show");
          mobileMenu.setAttribute("aria-hidden", "true");
          mobileMenuOverlay.setAttribute("aria-hidden", "true");
        });

      // close mobile menu when selecting one of its links
      document.querySelectorAll("#mobileMenu a").forEach((a) => {
        a.addEventListener("click", () => {
          mobileMenu.classList.remove("show");
          mobileMenuOverlay.classList.remove("show");
          mobileMenu.setAttribute("aria-hidden", "true");
          mobileMenuOverlay.setAttribute("aria-hidden", "true");
        });
      });

      // close sidebar when a nav link is clicked (mobile)
      document.querySelectorAll(".app-sidebar .nav-link").forEach((a) => {
        a.addEventListener("click", () => closeSidebar());
      });
    </script>
    <script>
      // Fetch recent transactions and monthly summary from backend and render
      (function () {
        const API_BASE = "http://localhost:3000";
        const userId = Number(localStorage.getItem("etrack_user_id") || 1);

        function formatCurrency(v) {
          try {
            return new Intl.NumberFormat("id-ID", {
              style: "currency",
              currency: "IDR",
              maximumFractionDigits: 0,
            }).format(v);
          } catch (e) {
            return "Rp " + v;
          }
        }

        // selectedMonth: Date pointing to first day of selected month
        let selectedMonth = new Date();
        selectedMonth.setDate(1);

        const monthLabel = document.getElementById("monthLabel");
        const prevBtn = document.getElementById("prevMonth");
        const nextBtn = document.getElementById("nextMonth");

        function toYMD(d) {
          return d.toISOString().slice(0, 10);
        }
        function startOfMonth(d) {
          const y = d.getFullYear(),
            m = d.getMonth();
          return new Date(y, m, 1);
        }
        function endOfMonth(d) {
          const y = d.getFullYear(),
            m = d.getMonth();
          return new Date(y, m + 1, 0);
        }
        function formatMonthLabel(d) {
          return d.toLocaleString("id-ID", { month: "long", year: "numeric" });
        }

        async function loadForMonth() {
          if (monthLabel)
            monthLabel.textContent = formatMonthLabel(selectedMonth);
          const start = toYMD(startOfMonth(selectedMonth));
          const end = toYMD(endOfMonth(selectedMonth));

          // get summary for selected month
          try {
            const sres = await fetch(
              `${API_BASE}/reports/summary?start=${start}&end=${end}&user_id=${userId}`
            );
            if (sres.ok) {
              const sjson = await sres.json();
              let income = 0,
                expense = 0;
              sjson.forEach((r) => {
                // note: r.type may be backticked or different; normalize
                const t = (r.type || "").toString().toLowerCase();
                if (t === "income") income += Number(r.total || 0);
                if (t === "expense") expense += Number(r.total || 0);
              });
              const balance = income - expense;
              const incEl = document.getElementById("incomeValue");
              if (incEl) incEl.textContent = formatCurrency(income);
              const expEl = document.getElementById("expensesValue");
              if (expEl) expEl.textContent = formatCurrency(expense);
              const balEl = document.getElementById("balanceValue");
              if (balEl) balEl.textContent = formatCurrency(balance);
            }
          } catch (err) {
            console.error("summary fetch error", err);
          }

          // fetch recent transactions for the selected month
          try {
            const tres = await fetch(
              `${API_BASE}/transactions?user_id=${userId}&start=${start}&end=${end}&limit=500`
            );
            if (!tres.ok) throw new Error("fail");
            const tx = await tres.json();
            const list = document.getElementById("transactionsList");
            if (!list) return;
            list.innerHTML = "";

            // group by date (YYYY-MM-DD)
            let lastDate = null;
            tx.forEach((t) => {
              const d = t.occurred_at ? t.occurred_at.split("T")[0] : "";
              if (d !== lastDate) {
                const dateHeader = document.createElement("div");
                dateHeader.className = "px-3 mt-3 small text-muted";
                const dateObj = new Date(d + "T00:00:00");
                dateHeader.textContent = isNaN(dateObj.getTime())
                  ? d
                  : dateObj.toLocaleDateString("id-ID", {
                      weekday: "short",
                      day: "2-digit",
                      month: "long",
                      year: "numeric",
                    });
                list.appendChild(dateHeader);
                lastDate = d;
              }

              const card = document.createElement("div");
              card.className = "tx-card d-flex align-items-center gap-3";
              const icon = document.createElement("div");
              icon.className = "tx-icon";
              icon.textContent = "💸";
              const title = document.createElement("div");
              title.className = "flex-grow-1";
              title.innerHTML = `<div class="fw-bold">${
                t.category || "Uncategorized"
              }</div><div class="small text-muted">${
                t.description || ""
              }</div>`;
              const amt = document.createElement("div");
              amt.className =
                t.type === "income"
                  ? "text-success fw-semibold"
                  : "text-danger fw-semibold";
              amt.textContent =
                (t.type === "income" ? "+ " : "- ") +
                formatCurrency(Number(t.amount || 0));
              card.appendChild(icon);
              card.appendChild(title);
              card.appendChild(amt);
              list.appendChild(card);
            });
          } catch (err) {
            console.error("transactions fetch error", err);
          }
        }

        // wire month buttons
        if (prevBtn)
          prevBtn.addEventListener("click", () => {
            selectedMonth.setMonth(selectedMonth.getMonth() - 1);
            loadForMonth();
          });
        if (nextBtn)
          nextBtn.addEventListener("click", () => {
            selectedMonth.setMonth(selectedMonth.getMonth() + 1);
            loadForMonth();
          });

        // initial load
        loadForMonth();
      })();
    </script>
  </body>
</html>
