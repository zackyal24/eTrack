<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eTrack — Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../asset/css/styles.css" />
    <link rel="stylesheet" href="../asset/css/dashboard.css" />
  </head>
  <body>
    <!-- Left Sidebar -->
    <aside class="app-sidebar">
      <div class="brand">
        <img src="../asset/img/logo.png" alt="eTrack logo" class="brand-logo" />
        <div id="sidebarUser" style="text-align: center; margin-top: 4px">
          <div
            id="sidebarUserName"
            style="font-weight: 700; font-size: 14px; line-height: 1"
          >
            User
          </div>
        </div>
      </div>
      <nav class="nav-list">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="report.html" class="nav-link">Report</a>
        <a href="goals.html" class="nav-link">Goals</a>
        <a href="../index.html" class="nav-link logout text-danger fw-semi-bold" onclick="logout()">
          Log out
        </a>
      </nav>
    </aside>

    <!-- mobile overlay (opened by navbar menu button) -->
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
    <!-- mobile small menu + overlay (used on small screens) -->
    <div
      id="mobileMenuOverlay"
      class="mobile-menu-overlay"
      aria-hidden="true"
    ></div>
    <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
      <a href="dashboard.html">Dashboard</a>
      <a href="report.html">Report</a>
      <a href="goals.html">Goals</a>
      <a href="../index.html" class="nav-link logout text-danger fw-semi-bold" onclick="logout()">
          Log out
        </a>
    </div>

    <!-- Top Navigation -->
    <div class="top-nav">
      <div class="d-flex align-items-center gap-2">
        <img src="../asset/img/logo.png" style="height: 34px" />
        <span id="mobileUserName" class="mobile-username">User</span>
      </div>
      <button id="navMenuBtn" class="btn text-white">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="currentColor"
          class="bi bi-list"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
          />
        </svg>
      </button>
    </div>

    <div class="main">
      <div class="container-dashboard content-inner">
        <script>
          // populate sidebar user name from localStorage
          (function () {
            const name = localStorage.getItem("etrack_user_name") || "User";
            const elName = document.getElementById("sidebarUserName");
            if (elName) elName.textContent = name;
            const mobileEl = document.getElementById("mobileUserName");
            if (mobileEl) mobileEl.textContent = name;
          })();
        </script>

        <!-- Page header -->
        <div
          class="page-header d-flex align-items-center justify-content-between mt-3 mb-2"
        >
          <div>
            <h1 class="mb-0">Dashboard</h1>
            <div class="text-muted small">
              Overview of your income, expenses and balance
            </div>
          </div>
        </div>

        <!-- Unified Month + Summary (single colored bar) -->
        <div
          class="summary-row d-flex align-items-center justify-content-between mt-3"
        >
          <div class="d-flex align-items-center gap-2">
            <button id="prevMonth" class="btn btn-sm btn-light">◀</button>
            <div id="monthLabel" class="fw-semibold">March 2025</div>
            <button id="nextMonth" class="btn btn-sm btn-light">▶</button>
          </div>

          <div class="d-flex gap-3 align-items-center">
            <div class="summary-item text-end">
              <div class="summary-title">Income</div>
              <div id="incomeValue" class="summary-value">Rp 0</div>
            </div>

            <div class="summary-item text-end">
              <div class="summary-title">Expenses</div>
              <div id="expensesValue" class="summary-value">Rp 0</div>
            </div>

            <div class="summary-item text-end">
              <div class="summary-title">Balance</div>
              <div id="balanceValue" class="summary-value">Rp 0</div>
            </div>
          </div>
        </div>

        

        <!-- Transactions (populated from backend) -->
        <div id="transactionsList" class="mt-2"></div>
      </div>
    </div>

    <!-- Transaction Detail Modal -->
      <div class="modal fade" id="transactionModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Detail Transaksi</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <p>
                <strong>Kategori:</strong> <span id="detailCategory"></span>
              </p>
              <p><strong>Jenis:</strong> <span id="detailType"></span></p>
              <p><strong>Jumlah:</strong> <span id="detailAmount"></span></p>
              <p><strong>Tanggal:</strong> <span id="detailDate"></span></p>
              <p><strong>Catatan:</strong> <span id="detailNote"></span></p>
            </div>

            <div class="modal-footer">
              <button id="editButton" class="btn btn-warning">Edit</button>
              <button id="deleteButton" class="btn btn-danger">Delete</button>
              <button class="btn btn-secondary" data-bs-dismiss="modal">
                Tutup
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Transaction Modal -->
<div class="modal fade" id="editTransactionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Transaksi</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editTransactionForm">
          <div class="mb-2">
            <label class="form-label">Kategori</label>
            <input type="text" id="editCategory" class="form-control" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Jenis</label>
            <select id="editType" class="form-select">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Jumlah</label>
            <input type="number" id="editAmount" class="form-control" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Tanggal</label>
            <input type="date" id="editDate" class="form-control" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Catatan</label>
            <textarea id="editNote" class="form-control"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="saveEditButton" class="btn btn-primary">Simpan</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>


    <!-- Floating Add Button -->
    <!-- Floating Add Button (single, with menu) -->
    <div class="position-fixed" style="bottom: 20px; right: 20px; z-index: 999">
      <!-- Hidden menu (placed above the button) -->
      <div id="fabMenu" class="" aria-hidden="true">
        <button id="fabIncome" class="fab-action income">
          <span class="dot">💰</span> <span>Income</span>
        </button>
        <button id="fabExpense" class="fab-action expense">
          <span class="dot">🧾</span> <span>Expense</span>
        </button>
      </div>

      <button
        id="fabBtn"
        class="fab-menu-plus btn rounded-circle"
        aria-controls="fabMenu"
        aria-expanded="false"
        style="
          width: 55px;
          height: 55px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 28px;
        "
      >
        +
      </button>

    <script>
      const API_BASE = "http://localhost:3000";
      const userId = Number(localStorage.getItem("etrack_user_id") || 1);

      if (!userId) {
        window.location.href = "../index.html"; // Redirect ke login
      }

      // GLOBAL FUNCTION
      function formatCurrency(v) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0,
        }).format(v);
      }

      // FAB MENU
      const fabBtn = document.getElementById("fabBtn");
      const fabMenu = document.getElementById("fabMenu");

      function openFabMenu() {
        fabMenu.classList.add("fab-menu-show");
        fabMenu.setAttribute("aria-hidden", "false");
        fabBtn.setAttribute("aria-expanded", "true");
      }

      function closeFabMenu() {
        fabMenu.classList.remove("fab-menu-show");
        fabMenu.setAttribute("aria-hidden", "true");
        fabBtn.setAttribute("aria-expanded", "false");
      }

      function toggleFabMenu() {
        if (fabMenu.classList.contains("fab-menu-show")) closeFabMenu();
        else openFabMenu();
      }

      fabBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFabMenu();
      });

      document.addEventListener("click", (e) => {
        if (!fabMenu.contains(e.target) && e.target !== fabBtn) closeFabMenu();
      });

      fabMenu.addEventListener("click", (e) => {
        e.stopPropagation();
        const btn = e.target.closest("button");
        if (!btn) return;
        if (btn.id === "fabIncome") {
          window.location.href = "income.html";
          return;
        }
        if (btn.id === "fabExpense") {
          window.location.href = "expense.html";
          return;
        }
        closeFabMenu();
      });

      // SIDEBAR MOBILE
      const sidebar = document.querySelector(".app-sidebar");
      const navMenuBtn = document.getElementById("navMenuBtn");
      const sidebarOverlay = document.getElementById("sidebarOverlay");
      const mobileMenu = document.getElementById("mobileMenu");
      const mobileMenuOverlay = document.getElementById("mobileMenuOverlay");

      function openSidebar() {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("show");
        sidebarOverlay.setAttribute("aria-hidden", "false");
      }
      function closeSidebar() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("show");
        sidebarOverlay.setAttribute("aria-hidden", "true");
      }

      navMenuBtn &&
        navMenuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (window.innerWidth <= 767) {
            const isOpen = mobileMenu.classList.contains("show");
            if (isOpen) {
              mobileMenu.classList.remove("show");
              mobileMenuOverlay.classList.remove("show");
              mobileMenu.setAttribute("aria-hidden", "true");
              mobileMenuOverlay.setAttribute("aria-hidden", "true");
            } else {
              mobileMenu.classList.add("show");
              mobileMenuOverlay.classList.add("show");
              mobileMenu.setAttribute("aria-hidden", "false");
              mobileMenuOverlay.setAttribute("aria-hidden", "false");
            }
            return;
          }
          openSidebar();
        });

      sidebarOverlay && sidebarOverlay.addEventListener("click", closeSidebar);

      mobileMenuOverlay &&
        mobileMenuOverlay.addEventListener("click", () => {
          mobileMenu.classList.remove("show");
          mobileMenuOverlay.classList.remove("show");
          mobileMenu.setAttribute("aria-hidden", "true");
          mobileMenuOverlay.setAttribute("aria-hidden", "true");
        });

      document.querySelectorAll("#mobileMenu a").forEach((a) => {
        a.addEventListener("click", () => {
          mobileMenu.classList.remove("show");
          mobileMenuOverlay.classList.remove("show");
          mobileMenu.setAttribute("aria-hidden", "true");
          mobileMenuOverlay.setAttribute("aria-hidden", "true");
        });
      });

      document.querySelectorAll(".app-sidebar .nav-link").forEach((a) => {
        a.addEventListener("click", () => closeSidebar());
      });

      function logout() {
        localStorage.clear();
        window.location.href = "../index.html";
      }

      // TRANSACTIONS
      let selectedMonth = new Date();
      selectedMonth.setDate(1);

      const monthLabel = document.getElementById("monthLabel");
      const prevBtn = document.getElementById("prevMonth");
      const nextBtn = document.getElementById("nextMonth");

      function toYMD(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const da = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${da}`;
      }

      function startOfMonth(d) {
        return new Date(d.getFullYear(), d.getMonth(), 1);
      }

      function endOfMonth(d) {
        return new Date(d.getFullYear(), d.getMonth() + 1, 0);
      }

      function formatDateDetail(dtString) {
  if (!dtString) return "-";

  const dt = new Date(dtString);

  const options = {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit'
  };

  return new Intl.DateTimeFormat('id-ID', options).format(dt);
}

      let currentTxId = null;

      function openTransactionModal(tx) {
  currentTxId = tx.id;

  document.getElementById("detailCategory").textContent = tx.category || "-";
  document.getElementById("detailType").textContent = tx.type || "-";
  document.getElementById("detailAmount").textContent = formatCurrency(tx.amount || 0);

  // ⬇️ Pakai format baru di sini
  document.getElementById("detailDate").textContent = formatDateDetail(tx.occurred_at);

  document.getElementById("detailNote").textContent = tx.description || "-";

  const modalEl = document.getElementById("transactionModal");
  const modal = new bootstrap.Modal(modalEl);
  modal.show();
}

      async function loadForMonth() {
        const start = toYMD(startOfMonth(selectedMonth));
        const end = toYMD(endOfMonth(selectedMonth));

        monthLabel.textContent = selectedMonth.toLocaleString("id-ID", {
          month: "long",
          year: "numeric",
        });

        // Fetch Summary
        try {
          const sres = await fetch(
            `${API_BASE}/reports/summary?start=${start}&end=${end}&user_id=${userId}`
          );
          if (sres.ok) {
            const data = await sres.json();
            let income = 0,
              expense = 0;
            data.forEach((r) => {
              const t = r.type?.toLowerCase();
              if (t === "income") income += r.total || 0;
              if (t === "expense") expense += r.total || 0;
            });

            document.getElementById("incomeValue").textContent =
              formatCurrency(income);
            document.getElementById("expensesValue").textContent =
              formatCurrency(expense);
            document.getElementById("balanceValue").textContent =
              formatCurrency(income - expense);
          }
        } catch (err) {
          console.error("summary fetch error", err);
        }

        // Fetch Transactions
        try {
          const tres = await fetch(
            `${API_BASE}/transactions?user_id=${userId}&start=${start}&end=${end}&limit=500`
          );
          if (!tres.ok) throw new Error("fail");
          const tx = await tres.json();
          const list = document.getElementById("transactionsList");
          list.innerHTML = "";

          let lastDate = null;
          tx.forEach((t) => {
            const d = t.occurred_at;
            if (!d) return;

            if (d !== lastDate) {
              const dateObj = new Date(d);
              const dateHeader = document.createElement("div");
              dateHeader.className = "px-3 mt-3 small text-muted";
              dateHeader.textContent = dateObj.toLocaleDateString("id-ID", {
                weekday: "short",
                day: "2-digit",
                month: "long",
                year: "numeric",
              });
              list.appendChild(dateHeader);
              lastDate = d;
            }

            const card = document.createElement("div");
            card.className = "tx-card d-flex align-items-center gap-3";
            card.dataset.txId = t.id;

            card.addEventListener("click", (e) => {
              e.stopPropagation();
              openTransactionModal(t);
            });

            card.innerHTML = `
          <div class="tx-icon">💸</div>
          <div class="flex-grow-1">
            <div class="fw-bold">${t.category || "Uncategorized"}</div>
            <div class="small text-muted">${t.description || ""}</div>
          </div>
          <div class="${
            t.type === "income" ? "text-success" : "text-danger"
          } fw-semibold">
            ${
              (t.type === "income" ? "+ " : "- ") +
              formatCurrency(t.amount || 0)
            }
          </div>
        `;
            list.appendChild(card);
          });
        } catch (err) {
          console.error("transactions fetch error", err);
        }
      }

      prevBtn.addEventListener("click", () => {
        selectedMonth.setMonth(selectedMonth.getMonth() - 1);
        loadForMonth();
      });

      nextBtn.addEventListener("click", () => {
        selectedMonth.setMonth(selectedMonth.getMonth() + 1);
        loadForMonth();
      });

      // DELETE handler
      document
        .getElementById("deleteButton")
        .addEventListener("click", async () => {
          if (!currentTxId || !confirm("Hapus transaksi ini?")) return;

          const res = await fetch(`${API_BASE}/transactions/${currentTxId}`, {
            method: "DELETE",
          });

          if (res.ok) {
            alert("Transaksi berhasil dihapus");
            loadForMonth();
            bootstrap.Modal.getInstance(
              document.getElementById("transactionModal")
            ).hide();
          } else {
            alert("Gagal menghapus transaksi");
          }
        });

      // EDIT handler
      let editModal, currentEditTx = null;

document.addEventListener("DOMContentLoaded", () => {
  editModal = new bootstrap.Modal(document.getElementById("editTransactionModal"));

  // Tombol Edit di modal detail
  document.getElementById("editButton").addEventListener("click", () => {
    if (!currentTxId) return;

    currentEditTx = Number(currentTxId);
    if (isNaN(currentEditTx)) {
      alert("ID transaksi tidak valid!");
      return;
    }

    // ambil data dari modal detail
    const category = document.getElementById("detailCategory").textContent;
    const type = document.getElementById("detailType").textContent.toLowerCase();
    const amountText = document.getElementById("detailAmount").textContent.replace(/[^\d]/g, "");
    const amount = Number(amountText) || 0;
    const date = document.getElementById("detailDate").textContent;
    const note = document.getElementById("detailNote").textContent;

    // isi form edit
    document.getElementById("editCategory").value = category !== "-" ? category : "";
    document.getElementById("editType").value = type === "income" ? "income" : "expense";
    document.getElementById("editAmount").value = amount;
    document.getElementById("editDate").value = date;
    document.getElementById("editNote").value = note !== "-" ? note : "";

    // tutup modal detail dan buka modal edit
    bootstrap.Modal.getInstance(document.getElementById("transactionModal")).hide();
    editModal.show();
  });

  // Tombol simpan edit
  document.getElementById("saveEditButton").addEventListener("click", async () => {
    if (!currentEditTx) return;

    const updatedTx = {
      category: document.getElementById("editCategory").value.trim(),
      type: document.getElementById("editType").value,
      amount: Number(document.getElementById("editAmount").value),
      occurred_at: document.getElementById("editDate").value,
      description: document.getElementById("editNote").value.trim(),
      user_id: Number(localStorage.getItem("etrack_user_id")) || 1
    };

    try {
      const res = await fetch(`${API_BASE}/transactions/${currentEditTx}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedTx),
      });

      if (res.ok) {
        alert("Transaksi berhasil diperbarui");
        editModal.hide();
        loadForMonth(); // refresh list
      } else if (res.status === 404) {
        alert("Transaksi tidak ditemukan di server!");
      } else {
        alert("Gagal memperbarui transaksi");
      }
    } catch (err) {
      console.error(err);
      alert("Terjadi error saat update transaksi");
    }
  });
});

      // INITIAL LOAD
      document.addEventListener("DOMContentLoaded", () => {
        loadForMonth();
      });
    </script>
    <!-- Bootstrap JS (bundle sudah include Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
