<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eTrack — Buat Akun</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #ffffff;
        font-family: "Inter", sans-serif;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .card-reg {
        width: 100%;
        max-width: 360px;
        padding: 22px;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(3, 12, 39, 0.06);
      }
      .brand {
        text-align: center;
        margin-bottom: 8px;
      }
      .brand img {
        width: 72px;
      }
      .title {
        text-align: center;
        font-weight: 700;
        margin-bottom: 10px;
        color: #08284a;
      }
      .form-control {
        border-radius: 20px;
        padding: 14px 16px;
      }
      .btn-primary.custom {
        background: #0056d2;
        border: none;
        border-radius: 20px;
        padding: 10px 16px;
        font-weight: 700;
      }
      .small-muted {
        font-size: 13px;
        color: #6c757d;
      }
      .divider {
        height: 1px;
        background: #e9ecef;
        margin: 14px 0;
      }
      .google-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        border-radius: 14px;
        padding: 8px 12px;
        background: white;
        box-shadow: 0 6px 18px rgba(3, 12, 39, 0.04);
      }
      .checkbox-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .footer-link {
        color: #0d6efd;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card-reg bg-white">
        <div class="brand">
          <img src="../asset/img/logo.png" alt="eTrack" />
        </div>
        <div class="title">Buat Akun</div>

        <form id="registerForm">
          <div class="mb-3">
            <input
              id="name"
              name="name"
              class="form-control"
              placeholder="Nama"
              required
            />
          </div>
          <div class="mb-3">
            <input
              id="email"
              type="email"
              name="email"
              class="form-control"
              placeholder="Email"
              required
            />
          </div>
          <div class="mb-3">
            <input
              id="phone"
              name="phone"
              class="form-control"
              placeholder="Telepon"
            />
          </div>
          <div class="mb-3">
            <input
              id="password"
              type="password"
              name="password"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>

          <div class="mb-3 checkbox-row">
            <input
              id="agree"
              type="checkbox"
              style="width: 18px; height: 18px"
            />
            <label for="agree" class="small-muted"
              >Saya menyetujui
              <a class="footer-link" href="#">Syarat & Ketentuan</a></label
            >
          </div>

          <div class="mb-3 text-center">
            <button
              id="submitBtn"
              class="btn btn-primary custom w-100"
              type="submit"
            >
              Daftar Sekarang
            </button>
          </div>

          <div class="divider"></div>

          <div class="mb-3 text-center small-muted">Daftar dengan</div>
          <div class="mb-2 text-center">
            <button id="googleBtn" type="button" class="google-btn w-100">
              <img
                src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png"
                style="width: 20px"
              />
              Google
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:3000";
      const form = document.getElementById("registerForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const agree = document.getElementById("agree").checked;
        if (!agree) {
          alert("Silakan setujui Syarat & Ketentuan");
          return;
        }

        const payload = {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          name: document.getElementById("name").value.trim(),
          phone: document.getElementById("phone").value.trim(),
        };

        try {
          const res = await fetch(API_BASE + "/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) {
            const j = await res.json().catch(() => ({}));
            console.error("Backend returned:", j);
            throw new Error(j.message || j.error || "Gagal mendaftar");
          }

          const user = await res.json();
          localStorage.setItem("etrack_user_id", String(user.id));
          localStorage.setItem("etrack_user_email", user.email || "");
          if (user.name) localStorage.setItem("etrack_user_name", user.name);
          // show success popup and provide button to go back to login
          showSuccessPopup();
        } catch (err) {
          console.error("register error", err);
          alert("Pendaftaran gagal: " + (err.message || "error"));
        }
      });

      // Google button placeholder
      document.getElementById("googleBtn").addEventListener("click", () => {
        alert("Login dengan Google belum disiapkan di demo ini.");
      });

      function showSuccessPopup() {
        // create overlay
        const overlay = document.createElement("div");
        overlay.style.position = "fixed";
        overlay.style.inset = "0";
        overlay.style.display = "flex";
        overlay.style.alignItems = "center";
        overlay.style.justifyContent = "center";
        overlay.style.zIndex = "9999";
        overlay.style.background = "rgba(0,0,0,0.45)";

        const box = document.createElement("div");
        box.style.background = "#fff";
        box.style.padding = "20px";
        box.style.borderRadius = "12px";
        box.style.width = "320px";
        box.style.boxShadow = "0 12px 30px rgba(3,12,39,0.12)";
        box.style.textAlign = "center";

        const title = document.createElement("div");
        title.textContent = "Pendaftaran Berhasil";
        title.style.fontWeight = "700";
        title.style.marginBottom = "8px";
        title.style.color = "#08284a";
        const msg = document.createElement("div");
        msg.textContent = "Akun Anda telah dibuat.";
        msg.style.marginBottom = "14px";
        msg.style.color = "#495057";

        const btn = document.createElement("button");
        btn.textContent = "Kembali ke Login";
        btn.style.background = "#0056d2";
        btn.style.color = "#fff";
        btn.style.border = "none";
        btn.style.padding = "10px 14px";
        btn.style.borderRadius = "10px";
        btn.style.fontWeight = "700";
        btn.style.cursor = "pointer";

        btn.addEventListener("click", () => {
          // go back to root login page
          window.location.href = "../index.html";
        });

        box.appendChild(title);
        box.appendChild(msg);
        box.appendChild(btn);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
      }
    </script>
  </body>
</html>
