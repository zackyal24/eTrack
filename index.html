<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eTrack — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-input {
      border-radius: 12px;
      padding: 12px;
      border: 1.5px solid #0d6efd;
    }

    .login-btn {
      border-radius: 20px;
      padding: 10px 0;
      background: #0056d2;
      font-weight: 600;
    }

    .google-btn {
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      padding: 10px 0;
      font-weight: 500;
    }

    @media (min-width: 992px) {
      body {
        background: linear-gradient(180deg, #f3f7ff, #ffffff);
      }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo -->
      <img src="logo.png" alt="eTrack Logo" style="width:130px;" class="mb-3">

      <h5 class="mb-4">Hai, Selamat datang!</h5>

      <!-- Input fields -->
      <input type="email" placeholder="Email" class="form-control login-input mb-3">
      <input type="password" placeholder="Password" class="form-control login-input mb-2">

      <div class="text-end mb-3 small">
        <a href="#" class="text-primary">lupa kata sandi?</a>
      </div>

      <!-- Login button -->
      <button class="btn btn-primary w-100 login-btn mb-3">Masuk</button>

      <!-- Divider -->
      <div class="d-flex align-items-center my-3">
        <div class="flex-grow-1" style="height:1px; background:#ccc;"></div>
        <div class="px-2 small text-muted">Masuk dengan</div>
        <div class="flex-grow-1" style="height:1px; background:#ccc;"></div>
      </div>

      <!-- Google login button -->
      <button class="btn w-100 google-btn d-flex justify-content-center align-items-center mb-3">
        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width:22px; margin-right:10px;"> Google
      </button>

      <!-- Register link -->
      <div class="small mt-3">
        Belum punya akun? <a href="#" class="text-primary">Daftar.</a>
      </div>

    </div>
  </div>

</body>
</html>
